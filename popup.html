<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Keep Alive</title>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"><span></span></div>
    <div><h1>Keep Alive</h1><p id="host">A verificar página…</p></div>
  </header>

  <main id="app" hidden>
    <section class="hero">
      <div>
        <strong>Manter sessão ativa</strong>
        <small id="summary">Desativado neste site</small>
      </div>
      <label class="switch"><input id="enabled" type="checkbox"><span></span></label>
    </section>

    <section class="settings">
      <label>Intervalo
        <select id="interval">
          <optgroup label="Fixo">
            <option value="fixed:0.5">30 segundos</option>
            <option value="fixed:1">1 minuto</option>
            <option value="fixed:2">2 minutos</option>
            <option value="fixed:5">5 minutos</option>
            <option value="fixed:10">10 minutos</option>
            <option value="fixed:15">15 minutos</option>
            <option value="fixed:30">30 minutos</option>
          </optgroup>
          <optgroup label="Aleatório">
            <option value="random:4:7">Entre 4 e 7 minutos</option>
            <option value="random:5:10">Entre 5 e 10 minutos</option>
            <option value="random:10:15">Entre 10 e 15 minutos</option>
            <option value="random:15:20">Entre 15 e 20 minutos</option>
            <option value="custom">Intervalo personalizado…</option>
          </optgroup>
        </select>
      </label>
      <div id="customInterval" class="custom-interval" hidden>
        <label>Mínimo (min)<input id="intervalMin" type="number" min="0.5" max="1440" step="0.5"></label>
        <label>Máximo (min)<input id="intervalMax" type="number" min="0.5" max="1440" step="0.5"></label>
      </div>
      <label>Método
        <select id="method">
          <option value="fetch">Pedido autenticado</option>
          <option value="activity">Simular atividade suave</option>
        </select>
      </label>
      <label id="endpointRow">URL de verificação <em>opcional</em>
        <input id="endpoint" type="url" placeholder="Usar a página atual">
      </label>
    </section>

    <div id="status" class="status" role="status"></div>
    <aside class="power-note">
      <div class="power-icon" aria-hidden="true">☾</div>
      <div>
        <strong>Evite suspender este site</strong>
        <p>O Keep Alive não funciona com o computador suspenso. Mantenha também este site sempre ativo no <span id="browserName">navegador</span>.</p>
        <button id="performanceSettings" class="settings-link">Abrir definições de desempenho</button>
      </div>
    </aside>
    <button id="test" class="primary">Testar agora</button>
    <button id="options" class="link">Gerir todos os sites</button>
  </main>
  <div id="unsupported" class="unsupported" hidden>Abra uma página <b>http</b> ou <b>https</b> para configurar o Keep Alive.</div>
  <script src="popup.js"></script>
</body>
</html>
